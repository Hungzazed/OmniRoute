name: Build App

# Manual-only since #11946. Builds standalone app & CLI package.
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with the tarball"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Fast Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"

      - name: Build Next.js app & CLI bundle
        run: |
          npm run build:release
        env:
          NODE_OPTIONS: "--max-old-space-size=10240"
          OMNIROUTE_BUILD_MEMORY_MB: "10240"
          OMNIROUTE_USE_TURBOPACK: "0"

      - name: Archive build outputs
        run: |
          tar -czf omniroute-build.tar.gz .build dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-build
          path: omniroute-build.tar.gz
          retention-days: 7

      - name: Package tarball and create GitHub Release
        if: ${{ inputs.create_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARBALL=$(npm pack)
          echo "Packed: $TARBALL"
          TAG="v3.8.53-apple-ui"
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          cat << 'EOF' > /tmp/release_notes.md
          ### OmniRoute Standalone Pre-built Release (Apple Minimalist UI)

          Bản build production hoàn chỉnh đã được đóng gói sẵn, không cần compile, chạy cực nhẹ (~100MB RAM):

          #### Cách 1: Chạy trực tiếp qua npx
          ```bash
          npx https://github.com/Hungzazed/OmniRoute/releases/download/v3.8.53-apple-ui/omniroute-3.8.53.tgz
          ```

          #### Cách 2: Cài đặt toàn cục (Global)
          ```bash
          npm install -g https://github.com/Hungzazed/OmniRoute/releases/download/v3.8.53-apple-ui/omniroute-3.8.53.tgz
          omniroute
          ```
          EOF
          gh release create "$TAG" "$TARBALL" omniroute-build.tar.gz \
            --title "OmniRoute v3.8.53 (Apple Minimalist UI)" \
            --notes-file /tmp/release_notes.md \
            --target "${{ github.ref }}"
